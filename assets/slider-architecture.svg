<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 440" width="100%" height="100%">
  <defs>
    <linearGradient id="sliderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf1e1" />
      <stop offset="100%" stop-color="#faebd7" />
    </linearGradient>

    <linearGradient id="cardActiveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes loopJumpLeft {
        0%, 80% { opacity: 0; transform: translateX(0); }
        85% { opacity: 1; }
        100% { opacity: 0; transform: translateX(-340px); }
      }
      @keyframes loopJumpRight {
        0%, 80% { opacity: 0; transform: translateX(0); }
        85% { opacity: 1; }
        100% { opacity: 0; transform: translateX(340px); }
      }
      @keyframes pulseHalo {
        0%, 100% { stroke-opacity: 0.9; stroke-width: 2.5; }
        50% { stroke-opacity: 0.3; stroke-width: 1.5; }
      }
      .active-border { animation: pulseHalo 2.5s infinite; }
      .jump-arrow-l { animation: loopJumpLeft 4s infinite; }
      .jump-arrow-r { animation: loopJumpRight 4s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1150" height="440" rx="16" fill="url(#sliderBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title & Subtitle -->
  <g transform="translate(48, 38)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="2">SEAMLESS RE-INDEXING &amp; CLONE MATRIX</text>
    <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fdf1e1">Tri-Set Infinite Slider Circular Buffer Model</text>
  </g>

  <!-- Visual Representation of 3 Cloned Sets -->
  <g transform="translate(48, 105)">
    <!-- SET 0: Underflow Buffer (Left) -->
    <g>
      <rect width="320" height="210" rx="12" fill="#1e293b" fill-opacity="0.45" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4" />
      <rect x="0" y="0" width="320" height="32" rx="12" fill="#334155" fill-opacity="0.5" />
      <text x="16" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SET 0: UNDERFLOW BUFFER [0..4]</text>

      <!-- Mini Cards -->
      <g transform="translate(18, 50)">
        <rect x="0" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="25" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#0</text>
        <rect x="58" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="83" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#1</text>
        <rect x="116" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="141" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#2</text>
        <rect x="174" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="199" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#3</text>
        <rect x="232" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="257" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#4</text>
      </g>
      <text x="16" y="145" font-family="sans-serif" font-size="10.5" fill="#64748b">When active &lt; 5 (user scrolls left past start):</text>
      <text x="16" y="165" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">jump(activeSight + 5)</text>
      <text x="16" y="185" font-family="sans-serif" font-size="10" fill="#94a3b8">Instant snap without CSS transition</text>
    </g>

    <!-- SET 1: Active Domain (Middle Set) -->
    <g transform="translate(366, 0)">
      <rect width="320" height="210" rx="12" fill="#0f2637" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" />
      <rect x="0" y="0" width="320" height="32" rx="12" fill="#0284c7" fill-opacity="0.3" />
      <circle cx="16" cy="16" r="4.5" fill="#4ade80" />
      <text x="28" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#fdf1e1">SET 1: ACTIVE DOMAIN [5..9] (INITIAL)</text>

      <!-- Mini Cards -->
      <g transform="translate(18, 50)">
        <!-- Card 5 (Active) -->
        <rect x="0" y="0" width="50" height="65" rx="6" fill="#fdf1e1" stroke="#4ade80" stroke-width="2" class="active-border" />
        <text x="25" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#000">#5★</text>
        
        <rect x="58" y="0" width="50" height="65" rx="6" fill="#fdf1e1" stroke="rgba(253,241,225,0.4)" />
        <text x="83" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#000">#6</text>
        <rect x="116" y="0" width="50" height="65" rx="6" fill="#fdf1e1" stroke="rgba(253,241,225,0.4)" />
        <text x="141" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#000">#7</text>
        <rect x="174" y="0" width="50" height="65" rx="6" fill="#fdf1e1" stroke="rgba(253,241,225,0.4)" />
        <text x="199" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#000">#8</text>
        <rect x="232" y="0" width="50" height="65" rx="6" fill="#fdf1e1" stroke="rgba(253,241,225,0.4)" />
        <text x="257" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#000">#9</text>
      </g>
      <text x="16" y="145" font-family="sans-serif" font-size="10.5" fill="#38bdf8">Smooth Sliding Zone (640ms cubic-bezier):</text>
      <text x="16" y="165" font-family="monospace" font-size="11" font-weight="600" fill="#4ade80">--sights-shift = -(width + gap) * active</text>
      <text x="16" y="185" font-family="sans-serif" font-size="10" fill="#94a3b8">Active index starts centered at #5 (Stari Most)</text>
    </g>

    <!-- SET 2: Overflow Buffer (Right) -->
    <g transform="translate(732, 0)">
      <rect width="320" height="210" rx="12" fill="#1e293b" fill-opacity="0.45" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4" />
      <rect x="0" y="0" width="320" height="32" rx="12" fill="#334155" fill-opacity="0.5" />
      <text x="16" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SET 2: OVERFLOW BUFFER [10..14]</text>

      <!-- Mini Cards -->
      <g transform="translate(18, 50)">
        <rect x="0" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="25" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#10</text>
        <rect x="58" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="83" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#11</text>
        <rect x="116" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="141" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#12</text>
        <rect x="174" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="199" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#13</text>
        <rect x="232" y="0" width="50" height="65" rx="6" fill="#fdf1e1" fill-opacity="0.25" stroke="#94a3b8" />
        <text x="257" y="38" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">#14</text>
      </g>
      <text x="16" y="145" font-family="sans-serif" font-size="10.5" fill="#64748b">When active &gt;= 10 (user scrolls right past end):</text>
      <text x="16" y="165" font-family="monospace" font-size="11" font-weight="600" fill="#f59e0b">jump(activeSight - 5)</text>
      <text x="16" y="185" font-family="sans-serif" font-size="10" fill="#94a3b8">Seamless return to identical card in Set 1</text>
    </g>
  </g>

  <!-- Bottom Architecture Notes -->
  <g transform="translate(48, 345)">
    <rect width="1004" height="64" rx="10" fill="#131e2b" stroke="#2563eb" stroke-opacity="0.4" />
    <circle cx="28" cy="32" r="10" fill="#2563eb" fill-opacity="0.2" />
    <text x="28" y="36" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#60a5fa">i</text>
    
    <text x="50" y="26" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fdf1e1">
      Screen-True Inverse Counter-Scaling Principle
    </text>
    <text x="50" y="46" font-family="sans-serif" font-size="10.5" fill="#94a3b8">
      Slider is child of .back-stack which zooms by --back-scale (0.76 to 1.30). By assigning --sights-scale: (1 / backScale), cards retain constant physical pixel dimensions on screen!
    </text>
  </g>
</svg>
