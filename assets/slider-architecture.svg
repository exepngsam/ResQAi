<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="archBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="60%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#050b12" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes sweepScan {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.6; }
        100% { transform: translateY(220px); opacity: 0.1; }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #ef4444; stroke-width: 1.5; }
        50% { stroke: #f87171; stroke-width: 2.5; }
      }
      .scanner-beam {
        animation: sweepScan 3.5s linear infinite;
      }
      .critical-border {
        animation: pulseBorder 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1100" height="420" rx="16" fill="url(#archBgGrad)" stroke="#1e3a5f" stroke-width="1.2" />

  <!-- Title Header -->
  <g transform="translate(40, 36)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff">
      EXPLAINABLE RISK (XAI) &amp; HUMAN-IN-THE-LOOP (HITL) DECISION ARCHITECTURE
    </text>
    <text y="22" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="1.5">
      MATHEMATICAL WEIGHT MATRIX &amp; COMMANDER AUTHORIZATION PROTOCOL
    </text>
  </g>

  <!-- Left: Mathematical Formula Box -->
  <g transform="translate(40, 85)">
    <rect width="520" height="300" rx="12" fill="#091422" stroke="#0284c7" stroke-width="1.2" />
    <rect width="520" height="34" rx="12" fill="#0e243b" />
    <text x="16" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">1. SPATIAL HEURISTIC RISK EQUATION</text>

    <!-- Formula Display -->
    <g transform="translate(20, 52)">
      <rect width="480" height="58" rx="8" fill="#0b1e33" stroke="#1e3a5f" />
      <text x="16" y="26" font-family="monospace" font-size="12" font-weight="700" fill="#00f0ff">
        Risk Score = 0.30·PopRisk + 0.25·FloodDepth + 0.20·RoadCutoff
      </text>
      <text x="96" y="46" font-family="monospace" font-size="12" font-weight="700" fill="#00f0ff">
        + 0.15·VictimDensity + 0.10·HospitalDist
      </text>
    </g>

    <!-- Factor Weights Breakdown -->
    <g transform="translate(20, 126)">
      <!-- Factor 1 -->
      <text x="0" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">Population at Risk (30%)</text>
      <rect x="170" y="10" width="310" height="12" rx="6" fill="#1e293b" />
      <rect x="170" y="10" width="93" height="12" rx="6" fill="#0284c7" />

      <!-- Factor 2 -->
      <text x="0" y="50" font-family="sans-serif" font-size="11" fill="#cbd5e1">Flood Inundation Depth (25%)</text>
      <rect x="170" y="40" width="310" height="12" rx="6" fill="#1e293b" />
      <rect x="170" y="40" width="77.5" height="12" rx="6" fill="#06b6d4" />

      <!-- Factor 3 -->
      <text x="0" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1">Road &amp; Bridge Cutoffs (20%)</text>
      <rect x="170" y="70" width="310" height="12" rx="6" fill="#1e293b" />
      <rect x="170" y="70" width="62" height="12" rx="6" fill="#f59e0b" />

      <!-- Factor 4 -->
      <text x="0" y="110" font-family="sans-serif" font-size="11" fill="#cbd5e1">Stranded Victim Density (15%)</text>
      <rect x="170" y="100" width="310" height="12" rx="6" fill="#1e293b" />
      <rect x="170" y="100" width="46.5" height="12" rx="6" fill="#ef4444" />

      <!-- Factor 5 -->
      <text x="0" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">Hospital Distance (10%)</text>
      <rect x="170" y="130" width="310" height="12" rx="6" fill="#1e293b" />
      <rect x="170" y="130" width="31" height="12" rx="6" fill="#8b5cf6" />
    </g>
  </g>

  <!-- Right: Decision & Human-in-the-Loop Protocol -->
  <g transform="translate(580, 85)">
    <rect width="480" height="300" rx="12" fill="#091422" stroke="#10b981" stroke-width="1.2" />
    <rect width="480" height="34" rx="12" fill="#0a2a1f" />
    <text x="16" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">2. TIER TRIAGE &amp; HITL DISPATCH GATE</text>

    <!-- Tier Thresholds Grid -->
    <g transform="translate(20, 52)">
      <!-- Tier Low -->
      <rect x="0" y="0" width="102" height="50" rx="6" fill="#052e16" stroke="#15803d" />
      <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#4ade80">LOW (0-25)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#86efac">Standard Patrol</text>

      <!-- Tier Mod -->
      <rect x="112" y="0" width="102" height="50" rx="6" fill="#292524" stroke="#a16207" />
      <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#facc15">MOD (26-50)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#fde047">Monitor Feeds</text>

      <!-- Tier High -->
      <rect x="224" y="0" width="102" height="50" rx="6" fill="#431407" stroke="#ea580c" />
      <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#fb923c">HIGH (51-75)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#fdba74">Stage Squads</text>

      <!-- Tier Crit -->
      <rect x="336" y="0" width="104" height="50" rx="6" fill="#450a0a" stroke="#b91c1c" class="critical-border" />
      <text x="12" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#f87171">CRIT (76-100)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10" fill="#fca5a5">Priority Extract</text>
    </g>

    <!-- Commander Sign-off Gate Modal Graphic -->
    <g transform="translate(20, 118)">
      <rect width="440" height="152" rx="8" fill="#121824" stroke="#334155" />
      <rect width="440" height="26" rx="8" fill="#1e293b" />
      <text x="14" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#94a3b8">TACTICAL AUTHORIZATION MODAL (HITL)</text>

      <text x="14" y="46" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Recommendation: Deploy SQUAD-04 to Zone 07</text>
      <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94a3b8">Route: Canal Corridor R-18 (Avoids submerged Highway H-02)</text>
      <text x="14" y="80" font-family="sans-serif" font-size="10" fill="#94a3b8">Estimated Transit: 14 mins | Capacity: 16 Victims</text>

      <!-- Action Buttons -->
      <g transform="translate(14, 96)">
        <rect width="190" height="34" rx="6" fill="#15803d" />
        <text x="95" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">✓ [APPROVE MISSION]</text>
      </g>
      <g transform="translate(220, 96)">
        <rect width="190" height="34" rx="6" fill="#991b1b" />
        <text x="95" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">✗ [REJECT / OVERRIDE]</text>
      </g>
    </g>
  </g>
</svg>
