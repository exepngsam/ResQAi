<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="40%" stop-color="#0a172a" />
      <stop offset="75%" stop-color="#081422" />
      <stop offset="100%" stop-color="#03070d" />
    </linearGradient>

    <!-- Tactical Radar Gradient -->
    <radialGradient id="radarSweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Linear Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Keyframe Styles -->
    <style>
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseBeacon {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.35); opacity: 0.3; }
      }
      @keyframes waveStream {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkFast {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .radar-scanner {
        transform-origin: 600px 180px;
        animation: radarRotate 9s linear infinite;
      }
      .beacon-ring-1 {
        transform-origin: 220px 140px;
        animation: pulseBeacon 2.6s ease-out infinite;
      }
      .beacon-ring-2 {
        transform-origin: 980px 160px;
        animation: pulseBeacon 3.2s ease-out infinite 0.8s;
      }
      .data-stream {
        stroke-dasharray: 8 6;
        animation: waveStream 6s linear infinite;
      }
      .status-dot {
        animation: blinkFast 1.4s ease-in-out infinite;
      }
      .floating-pill {
        animation: floatCard 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="18" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Tactical Grid Lines -->
  <g stroke="#0f2b48" stroke-width="1" stroke-opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />

    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Central Tactical Radar Concentric Circles -->
  <g stroke="#00f0ff" stroke-opacity="0.18" fill="none">
    <circle cx="600" cy="180" r="80" stroke-width="1" />
    <circle cx="600" cy="180" r="140" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="600" cy="180" r="200" stroke-width="1.2" />
    <circle cx="600" cy="180" r="260" stroke-width="1" stroke-dasharray="6 8" />
  </g>

  <!-- Rotating Radar Sweep Cone -->
  <g class="radar-scanner">
    <path d="M 600 180 L 860 180 A 260 260 0 0 0 810 50 Z" fill="url(#radarSweepGrad)" />
    <line x1="600" y1="180" x2="860" y2="180" stroke="#00f0ff" stroke-width="1.8" filter="url(#glowCyan)" />
  </g>

  <!-- Geo-Coordinate Arc Lines -->
  <path d="M 120 280 Q 600 60 1080 280" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.45" class="data-stream" />
  <path d="M 160 300 Q 600 110 1040 300" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 6" />

  <!-- Emergency Beacon Nodes -->
  <!-- Left Beacon (Zone 07 High Hazard) -->
  <g>
    <circle class="beacon-ring-1" cx="220" cy="140" r="28" fill="none" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="220" cy="140" r="8" fill="#ef4444" filter="url(#glowRed)" />
    <circle cx="220" cy="140" r="3" fill="#ffffff" />
    <text x="236" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171" letter-spacing="1">CRITICAL ZONE 07</text>
    <text x="236" y="150" font-family="monospace" font-size="10" fill="#94a3b8">DEPTH: 3.4M | 14 TRAPPED</text>
  </g>

  <!-- Right Beacon (Rescue Drone Squad) -->
  <g>
    <circle class="beacon-ring-2" cx="980" cy="160" r="24" fill="none" stroke="#10b981" stroke-width="1.5" />
    <circle cx="980" cy="160" r="8" fill="#10b981" filter="url(#glowCyan)" />
    <circle cx="980" cy="160" r="3" fill="#ffffff" />
    <text x="830" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1" text-anchor="start">SQUAD RESCUE-04</text>
    <text x="830" y="170" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="start">EN ROUTE VIA CANAL R-18</text>
  </g>

  <!-- Header Telemetry Bar -->
  <g transform="translate(40, 28)">
    <!-- Live Status Pill -->
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#0f1f33" stroke="#0284c7" stroke-width="1" />
    <circle class="status-dot" cx="16" cy="14" r="5" fill="#10b981" />
    <text x="28" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">SYSTEM LIVE: ACTIVE</text>

    <!-- Location & Telemetry Telemetry -->
    <rect x="206" y="0" width="310" height="28" rx="14" fill="#0f1f33" stroke="#1e3a5f" stroke-width="1" />
    <text x="220" y="18" font-family="monospace" font-size="11" fill="#94a3b8">LAT 20.35°N · LON 86.10°E · MAHANADI</text>

    <!-- Defense / Protocol Badge -->
    <rect x="910" y="0" width="250" height="28" rx="14" fill="#1c1214" stroke="#ef4444" stroke-width="1" />
    <circle class="status-dot" cx="924" cy="14" r="4.5" fill="#ef4444" />
    <text x="936" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#f87171" letter-spacing="1">DEFCON-1 DISASTER LEVEL</text>
  </g>

  <!-- Central Title Display -->
  <g transform="translate(600, 168)" text-anchor="middle">
    <!-- Big Title -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="5">
      ResQ<tspan fill="#00f0ff">AI</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="32" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="4">
      AUTONOMOUS MULTI-SOURCE DISASTER INTELLIGENCE &amp; MISSION CONTROL
    </text>
    
    <text y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1.5">
      Enterprise AI Decision-Support • Real-Time GIS Telemetry • Drone Search &amp; Rescue • Human-in-the-Loop Dispatch
    </text>
  </g>

  <!-- Bottom Feature Badges / Cards -->
  <g transform="translate(60, 290)">
    <!-- Card 1: Multi-Source Fusion -->
    <g class="floating-pill" transform="translate(0, 0)">
      <rect width="250" height="74" rx="12" fill="#0b1728" stroke="#0284c7" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="28" cy="37" r="16" fill="#0c2a47" />
      <text x="28" y="42" font-size="16" text-anchor="middle">🛰️</text>
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Multi-Source Fusion</text>
      <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">SAR Satellites + Drones + Gauges</text>
    </g>

    <!-- Card 2: Explainable Risk AI -->
    <g class="floating-pill" transform="translate(276, 0)">
      <rect width="250" height="74" rx="12" fill="#0b1728" stroke="#10b981" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="28" cy="37" r="16" fill="#063628" />
      <text x="28" y="42" font-size="16" text-anchor="middle">🧠</text>
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Explainable Risk AI</text>
      <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">P1–P4 Dynamic Triage Scoring</text>
    </g>

    <!-- Card 3: Human-in-the-Loop -->
    <g class="floating-pill" transform="translate(552, 0)">
      <rect width="250" height="74" rx="12" fill="#0b1728" stroke="#f59e0b" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="28" cy="37" r="16" fill="#3b2b0a" />
      <text x="28" y="42" font-size="16" text-anchor="middle">🛡️</text>
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Human-in-the-Loop</text>
      <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Commander Sign-off &amp; Audit Trail</text>
    </g>

    <!-- Card 4: Dynamic Watercraft Routing -->
    <g class="floating-pill" transform="translate(828, 0)">
      <rect width="250" height="74" rx="12" fill="#0b1728" stroke="#8b5cf6" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="28" cy="37" r="16" fill="#261447" />
      <text x="28" y="42" font-size="16" text-anchor="middle">⚡</text>
      <text x="56" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Dijkstra Safe Routing</text>
      <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Submerged Avoidance &amp; Boat Paths</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="418" x2="1200" y2="418" stroke="url(#accentCyan)" stroke-width="2.5" />
</svg>
