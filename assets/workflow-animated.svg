<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 480" width="100%" height="100%">
  <defs>
    <!-- Dark Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d14" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <!-- Node Card Fill -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142433" />
      <stop offset="100%" stop-color="#0b141e" />
    </linearGradient>

    <!-- Flow Pulses -->
    <linearGradient id="flowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      @keyframes activeBorder {
        0%, 100% { stroke: #38bdf8; }
        50% { stroke: #4ade80; }
      }
      .flow-path {
        stroke-dasharray: 6 6;
        animation: dashAnim 1.8s linear infinite;
      }
      .node-card {
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1150" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">SYSTEM CHOREOGRAPHY &amp; INTERPOLATION PIPELINE</text>
    <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fdf1e1">Cinematic Scroll Engine Workflow Model</text>
  </g>

  <!-- Connecting Pipes / Flowlines -->
  <g fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.45">
    <!-- 1 -> 2 -->
    <path d="M 230 180 L 290 180" />
    <!-- 2 -> 3 -->
    <path d="M 500 180 L 560 180" />
    <!-- 3 -> 4 -->
    <path d="M 770 180 L 830 180" />
    <!-- Feedback / Raf loop -->
    <path d="M 945 240 C 945 360, 395 360, 395 240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5" class="flow-path" />
  </g>

  <!-- Animated Pulse lines on top of connectors -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-path">
    <path d="M 230 180 L 290 180" />
    <path d="M 500 180 L 560 180" />
    <path d="M 770 180 L 830 180" />
  </g>

  <!-- Flow Loop Annotation -->
  <g transform="translate(670, 375)">
    <rect x="-120" y="-14" width="240" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24">
      rAF Pending Guard &amp; Convergence Check
    </text>
  </g>

  <!-- STAGE 1: TELEMETRY INGESTION -->
  <g transform="translate(48, 110)" filter="url(#nodeShadow)">
    <rect width="180" height="150" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" />
    <rect x="0" y="0" width="180" height="34" rx="12" fill="#0284c7" fill-opacity="0.22" />
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="0.5">1. TELEMETRY INGEST</text>

    <!-- Details -->
    <text x="16" y="58" font-family="monospace" font-size="11.5" font-weight="600" fill="#fdf1e1">window.scroll</text>
    <text x="16" y="74" font-family="sans-serif" font-size="10.5" fill="#94a3b8">getScrollDistance()</text>
    
    <text x="16" y="102" font-family="monospace" font-size="11.5" font-weight="600" fill="#fdf1e1">pointermove</text>
    <text x="16" y="118" font-family="sans-serif" font-size="10.5" fill="#94a3b8">targetMouseX/Y</text>

    <text x="16" y="142" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">Passive Event Batching</text>
  </g>

  <!-- STAGE 2: INERTIA & INTERPOLATION -->
  <g transform="translate(290, 110)" filter="url(#nodeShadow)">
    <rect width="210" height="150" rx="12" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="1.4" />
    <rect x="0" y="0" width="210" height="34" rx="12" fill="#16a34a" fill-opacity="0.2" />
    <circle cx="20" cy="17" r="4.5" fill="#4ade80" />
    <text x="32" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#bbf7d0" letter-spacing="0.5">2. INERTIA / LERP CORE</text>

    <!-- Details -->
    <text x="16" y="58" font-family="monospace" font-size="11.5" font-weight="600" fill="#fdf1e1">smoothScroll</text>
    <text x="16" y="74" font-family="sans-serif" font-size="10.5" fill="#94a3b8">lerp(smooth, target, 0.14)</text>
    
    <text x="16" y="102" font-family="monospace" font-size="11.5" font-weight="600" fill="#fdf1e1">mouseX / mouseY</text>
    <text x="16" y="118" font-family="sans-serif" font-size="10.5" fill="#94a3b8">lerp(mouse, target, 0.12)</text>

    <text x="16" y="142" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#4ade80">60 FPS Cinematic Glide</text>
  </g>

  <!-- STAGE 3: SEGMENT RESOLVER -->
  <g transform="translate(560, 95)" filter="url(#nodeShadow)">
    <rect width="210" height="180" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.4" />
    <rect x="0" y="0" width="210" height="34" rx="12" fill="#7e22ce" fill-opacity="0.2" />
    <circle cx="20" cy="17" r="4.5" fill="#c084fc" />
    <text x="32" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#f3e8ff" letter-spacing="0.5">3. SEGMENT RESOLVER</text>

    <!-- Details -->
    <text x="16" y="56" font-family="sans-serif" font-size="10" font-weight="700" fill="#e9d5ff">Act 1: Title Ascend (0-650px)</text>
    <text x="16" y="70" font-family="sans-serif" font-size="9" fill="#a855f7">introExit = smoothstep(90, 650)</text>

    <text x="16" y="92" font-family="sans-serif" font-size="10" font-weight="700" fill="#e9d5ff">Act 2: Arch Widening (560-1620)</text>
    <text x="16" y="106" font-family="sans-serif" font-size="9" fill="#a855f7">splitDrift = pow(enter, 1.5)</text>

    <text x="16" y="128" font-family="sans-serif" font-size="10" font-weight="700" fill="#e9d5ff">Act 3: Bazaar Saturation</text>
    <text x="16" y="142" font-family="sans-serif" font-size="9" fill="#a855f7">frame3 = segmentInOut(1760-2700)</text>

    <text x="16" y="164" font-family="sans-serif" font-size="10" font-weight="700" fill="#e9d5ff">Act 4: Sights Entry (2760-3560)</text>
  </g>

  <!-- STAGE 4: CSS VARS & COMPOSITOR -->
  <g transform="translate(830, 95)" filter="url(#nodeShadow)">
    <rect width="270" height="180" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.4" />
    <rect x="0" y="0" width="270" height="34" rx="12" fill="#d97706" fill-opacity="0.22" />
    <circle cx="20" cy="17" r="4.5" fill="#f59e0b" />
    <text x="32" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#fef3c7" letter-spacing="0.5">4. CSS MATRIX &amp; GPU BLIT</text>

    <!-- Details -->
    <text x="16" y="56" font-family="monospace" font-size="10.5" fill="#38bdf8">--bridge-width: 67.2-105vw</text>
    <text x="16" y="74" font-family="monospace" font-size="10.5" fill="#38bdf8">--split-left/right-x: ±46vw</text>
    <text x="16" y="92" font-family="monospace" font-size="10.5" fill="#38bdf8">--sights-enter-x: 420vw → 0vw</text>
    <text x="16" y="110" font-family="monospace" font-size="10.5" fill="#38bdf8">--sights-scale: 1 / backScale</text>
    <text x="16" y="128" font-family="monospace" font-size="10.5" fill="#38bdf8">--shade-alpha: [0.465, 0.42, 0.51]</text>

    <!-- GPU Badge -->
    <rect x="16" y="146" width="238" height="22" rx="6" fill="#1e293b" />
    <text x="135" y="161" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#4ade80">Zero Layout Reflow (GPU Compositor)</text>
  </g>

  <!-- Bottom Timeline Progress Track -->
  <g transform="translate(48, 410)">
    <text x="0" y="-8" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">SCROLL RIG DISTANCE TIMELINE (0px TO 3700px)</text>
    
    <!-- Timeline Bar -->
    <rect x="0" y="0" width="1052" height="14" rx="7" fill="#1e293b" />
    
    <!-- Act 1 -->
    <rect x="0" y="0" width="180" height="14" rx="7" fill="#38bdf8" fill-opacity="0.8" />
    <!-- Act 2 -->
    <rect x="180" y="0" width="280" height="14" fill="#6366f1" fill-opacity="0.8" />
    <!-- Act 3 -->
    <rect x="460" y="0" width="270" height="14" fill="#a855f7" fill-opacity="0.8" />
    <!-- Act 4 -->
    <rect x="730" y="0" width="322" height="14" rx="7" fill="#10b981" fill-opacity="0.8" />

    <!-- Labels below timeline -->
    <text x="90" y="28" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Act I: Hero (0-650)</text>
    <text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#818cf8">Act II: Stari Most (560-1620)</text>
    <text x="595" y="28" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#c084fc">Act III: Bazaar (1760-2700)</text>
    <text x="890" y="28" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#34d399">Act IV: Sights Slider (2760-3700)</text>
  </g>
</svg>
