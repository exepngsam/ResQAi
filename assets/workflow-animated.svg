      <rect width="202" height="52" rx="8" fill="#0c2018" stroke="#164e39" />
      <text x="12" y="22" font-size="15">🚤</text>
      <text x="36" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Resource Allocator</text>
      <text x="36" y="38" font-family="monospace" font-size="10" fill="#6ee7b7">NDRF Unit Dispatch Match</text>
    </g>

    <!-- Engine 5: RAG Copilot -->
    <g transform="translate(14, 296)">
      <rect width="202" height="52" rx="8" fill="#0c2018" stroke="#164e39" />
      <text x="12" y="22" font-size="15">🤖</text>
      <text x="36" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">DisasterIQ Copilot RAG</text>
      <text x="36" y="38" font-family="monospace" font-size="10" fill="#6ee7b7">NDMA Protocol Citations</text>
    </g>
  </g>

  <!-- 3. STATE & EVENT BUS (X: 610) -->
  <g transform="translate(610, 85)">
    <rect width="180" height="360" rx="12" fill="#091422" stroke="#8b5cf6" stroke-width="1.2" />
    <rect width="180" height="34" rx="12" fill="#20103b" />
    <text x="14" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">3. STATE &amp; SYNC</text>

    <!-- Thread-safe Memory Store -->
    <g transform="translate(12, 60)">
      <rect width="156" height="110" rx="8" fill="#140a26" stroke="#4c1d95" />
      <circle cx="26" cy="28" r="12" fill="#2e1065" />
      <text x="26" y="33" font-size="14" text-anchor="middle">💾</text>
      <text x="46" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">In-Memory / GIS</text>
      <text x="16" y="60" font-family="monospace" font-size="10" fill="#a78bfa">• Thread-Safe Storage</text>
      <text x="16" y="78" font-family="monospace" font-size="10" fill="#a78bfa">• Spatial Polygons</text>
      <text x="16" y="96" font-family="monospace" font-size="10" fill="#a78bfa">• 8 Sector Geometries</text>
    </g>

    <!-- WebSocket Hub -->
    <g transform="translate(12, 196)">
      <rect width="156" height="130" rx="8" fill="#140a26" stroke="#4c1d95" />
      <circle cx="26" cy="28" r="12" fill="#2e1065" />
      <text x="26" y="33" font-size="14" text-anchor="middle">⚡</text>
      <text x="46" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">WebSocket Hub</text>
      <text x="16" y="60" font-family="monospace" font-size="10" fill="#a78bfa">• Real-Time Broadcast</text>
      <text x="16" y="78" font-family="monospace" font-size="10" fill="#a78bfa">• Sub-Second Latency</text>
      <text x="16" y="96" font-family="monospace" font-size="10" fill="#a78bfa">• Simulation Stream</text>
      <text x="16" y="114" font-family="monospace" font-size="10" fill="#a78bfa">• Disconnection Queue</text>
    </g>
  </g>

  <!-- 4. COMMAND CENTER & FIELD ACTIONS (X: 840) -->
  <g transform="translate(840, 85)">
    <rect width="210" height="360" rx="12" fill="#091422" stroke="#f59e0b" stroke-width="1.2" />
    <rect width="210" height="34" rx="12" fill="#332009" />
    <text x="14" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1">4. COMMAND &amp; FIELD</text>

    <!-- Tactical GIS Map -->
    <g transform="translate(12, 48)">
      <rect width="186" height="64" rx="8" fill="#1f1406" stroke="#78350f" />
      <text x="14" y="24" font-size="16">🗺️</text>
      <text x="42" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Tactical GIS Map</text>
      <text x="42" y="42" font-family="monospace" font-size="10" fill="#fcd34d">Leaflet Dark Matter HUD</text>
    </g>

    <!-- Commander HITL Modal -->
    <g transform="translate(12, 122)">
      <rect width="186" height="64" rx="8" fill="#2b0d10" stroke="#991b1b" stroke-width="1.5" />
      <text x="14" y="24" font-size="16">🛡️</text>
      <text x="42" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#f87171">Human-in-the-Loop</text>
      <text x="42" y="38" font-family="monospace" font-size="10" fill="#fca5a5">[APPROVE] / [REJECT]</text>
      <text x="42" y="52" font-family="monospace" font-size="9" fill="#94a3b8">Cryptographic Audit ID</text>
    </g>

    <!-- Mobile HUD -->
    <g transform="translate(12, 196)">
      <rect width="186" height="64" rx="8" fill="#1f1406" stroke="#78350f" />
      <text x="14" y="24" font-size="16">📱</text>
      <text x="42" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Mobile Responder HUD</text>
      <text x="42" y="42" font-family="monospace" font-size="10" fill="#fcd34d">Single-Tap Rescue Ops</text>
    </g>

    <!-- ICS-201 Report -->
    <g transform="translate(12, 270)">
      <rect width="186" height="64" rx="8" fill="#1f1406" stroke="#78350f" />
      <text x="14" y="24" font-size="16">📑</text>
      <text x="42" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">ICS-201 SitRep Export</text>
      <text x="42" y="42" font-family="monospace" font-size="10" fill="#fcd34d">State Disaster Authority</text>
    </g>
  </g>
</svg>
