<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040912" />
      <stop offset="50%" stop-color="#0a1626" />
      <stop offset="100%" stop-color="#030810" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2338" />
      <stop offset="100%" stop-color="#081524" />
    </linearGradient>

    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes flowRight {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.4); opacity: 0.4; }
      }
      @keyframes packetTravel {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(200px); opacity: 0; }
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowRight 2s linear infinite;
      }
      .pulse-marker {
        animation: pulseDot 2s ease-in-out infinite;
      }
      .node-card:hover {
        filter: brightness(1.15);
      }
    </style>
  </defs>

  <rect width="1100" height="480" rx="16" fill="url(#wfBgGrad)" stroke="#1e3a5f" stroke-width="1.2" />

  <!-- Section Title -->
  <g transform="translate(50, 42)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">
      RESQAI END-TO-END OPERATIONAL INTELLIGENCE PIPELINE
    </text>
    <text y="20" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="1.5">
      MULTI-TIER EVENT SENSING ➔ AI REASONING ➔ HUMAN-IN-THE-LOOP DISPATCH
    </text>
  </g>

  <!-- Connecting Bus Lines -->
  <!-- Lane 1 -> Lane 2 -->
  <line x1="280" y1="210" x2="330" y2="210" stroke="#00f0ff" stroke-width="2" class="flow-line" />
  <line x1="280" y1="350" x2="330" y2="280" stroke="#00f0ff" stroke-width="2" class="flow-line" />
  <line x1="280" y1="130" x2="330" y2="160" stroke="#00f0ff" stroke-width="2" class="flow-line" />

  <!-- Lane 2 -> Lane 3 -->
  <line x1="560" y1="230" x2="610" y2="230" stroke="#10b981" stroke-width="2.5" class="flow-line" />

  <!-- Lane 3 -> Lane 4 -->
  <line x1="790" y1="170" x2="840" y2="170" stroke="#f59e0b" stroke-width="2" class="flow-line" />
  <line x1="790" y1="310" x2="840" y2="310" stroke="#ef4444" stroke-width="2" class="flow-line" />

  <!-- 1. MULTI-SOURCE INGESTION (X: 50) -->
  <g transform="translate(50, 85)">
    <rect width="230" height="360" rx="12" fill="#091422" stroke="#0284c7" stroke-width="1.2" />
    <rect width="230" height="34" rx="12" fill="#0e243b" />
    <text x="16" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">1. INGESTION SILOS</text>

    <!-- Node A: Satellites -->
    <g transform="translate(14, 48)">
      <rect width="202" height="64" rx="8" fill="#0d1b2d" stroke="#1e3a5f" />
      <text x="14" y="24" font-size="16">🛰️</text>
      <text x="42" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">SAR Satellite Passes</text>
      <text x="42" y="42" font-family="monospace" font-size="10" fill="#94a3b8">Sentinel-1 Inundation</text>
    </g>

    <!-- Node B: Aerial Drones -->
    <g transform="translate(14, 122)">
      <rect width="202" height="64" rx="8" fill="#0d1b2d" stroke="#1e3a5f" />
      <text x="14" y="24" font-size="16">🚁</text>
      <text x="42" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Aerial Recon Drones</text>
      <text x="42" y="42" font-family="monospace" font-size="10" fill="#94a3b8">4K Live H.264 Streams</text>
    </g>

    <!-- Node C: River Gauges -->
    <g transform="translate(14, 196)">
      <rect width="202" height="64" rx="8" fill="#0d1b2d" stroke="#1e3a5f" />
      <text x="14" y="24" font-size="16">🌊</text>
      <text x="42" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">CCTV River Gauges</text>
      <text x="42" y="42" font-family="monospace" font-size="10" fill="#94a3b8">Mahanadi Delta Sensors</text>
    </g>

    <!-- Node D: Citizen SOS -->
    <g transform="translate(14, 270)">
      <rect width="202" height="64" rx="8" fill="#0d1b2d" stroke="#1e3a5f" />
      <text x="14" y="24" font-size="16">📱</text>
      <text x="42" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Citizen Emergency SOS</text>
      <text x="42" y="42" font-family="monospace" font-size="10" fill="#94a3b8">Crowdsourced GPS Pins</text>
    </g>
  </g>

  <!-- 2. AI REASONING CORE (X: 330) -->
  <g transform="translate(330, 85)">
    <rect width="230" height="360" rx="12" fill="#091422" stroke="#10b981" stroke-width="1.2" />
    <rect width="230" height="34" rx="12" fill="#0a2a1f" />
    <text x="16" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1">2. INTELLIGENCE CORE</text>

    <!-- Engine 1: Vision Triage -->
    <g transform="translate(14, 48)">
      <rect width="202" height="52" rx="8" fill="#0c2018" stroke="#164e39" />
      <text x="12" y="22" font-size="15">👁️</text>
      <text x="36" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Vision Victim Triage</text>
      <text x="36" y="38" font-family="monospace" font-size="10" fill="#6ee7b7">YOLO Stranded Detection</text>
    </g>

    <!-- Engine 2: Spatial Risk Engine -->
    <g transform="translate(14, 110)">
      <rect width="202" height="52" rx="8" fill="#0c2018" stroke="#164e39" />
      <text x="12" y="22" font-size="15">📐</text>
      <text x="36" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Heuristic Risk Matrix</text>
      <text x="36" y="38" font-family="monospace" font-size="10" fill="#6ee7b7">P1–P4 Severity Formula</text>
    </g>

    <!-- Engine 3: Safe Pathfinding -->
    <g transform="translate(14, 172)">
      <rect width="202" height="52" rx="8" fill="#0c2018" stroke="#164e39" />
      <text x="12" y="22" font-size="15">🧭</text>
      <text x="36" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Dijkstra Safe Routing</text>
      <text x="36" y="38" font-family="monospace" font-size="10" fill="#6ee7b7">Submerged Cutoff Routing</text>
